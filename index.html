<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Para Mis Ojitos Brillantes 💕</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #1a0b2e; /* Fondo oscuro tipo galaxia */
            color: white;
            font-family: 'Arial', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
        }
        .mensaje {
            background: rgba(255, 255, 255, 0.1);
            padding: 20px;
            border-radius: 20px;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.3);
        }
        .corazon {
            font-size: 50px;
            margin-bottom: 10px;
        }
        .reproductor {
            margin-top: 20px;
            background: #331a4d;
            padding: 15px;
            border-radius: 15px;
            width: 80%;
            max-width: 300px;
        }
    </style>
</head>
<body>

    <div class="mensaje">
        <div class="corazon">💕</div>
        <p>Te Amo Muchote Mis Ojitos Brillantes</p>
    </div>

    <div class="reproductor">
        <p style="font-size: 12px; margin-bottom: 5px;">Reproduciendo: BLUE - Billie Eilish</p>
        <!-- Sustituye 'tu-archivo-de-musica.mp3' por el link directo de tu canción -->
        <audio id="cancion" controls style="width: 100%;">
            <source src="URL_DE_TU_CANCION.mp3" type="audio/mpeg">
            Tu navegador no soporta el audio.
        </audio>
    </div>

</body>
</html>
