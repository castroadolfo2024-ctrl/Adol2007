<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Para mi princesa 💕</title>
    <style>
        body { margin: 0; background: #000; overflow: hidden; color: white; font-family: sans-serif; text-align: center; }
        canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }
        .content { position: relative; z-index: 10; padding-top: 45vh; }
        h1 { font-size: 1.5rem; text-shadow: 0 0 10px #fff; }
        audio { opacity: 0.3; margin-top: 20px; }
    </style>
</head>
<body>
    <canvas id="stars"></canvas>
    <div class="content">
        <h1>Para mí princesa hermosa 💕</h1>
        <audio controls autoplay loop>
            <source src="blue.mp3" type="audio/mpeg">
        </audio>
    </div>
    <script>
        const canvas = document.getElementById('stars');
        const ctx = canvas.getContext('2d');
        let stars = [];
        function resize() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
        window.onresize = resize; resize();
        for(let i=0; i<200; i++) { stars.push({x: Math.random()*canvas.width, y: Math.random()*canvas.height, r: Math.random()*1.5, d: Math.random()*0.5}); }
        function draw() {
            ctx.clearRect(0,0,canvas.width,canvas.height); ctx.fillStyle = "white";
            stars.forEach(s => { ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, Math.PI*2); ctx.fill(); s.y += s.d; if(s.y > canvas.height) s.y = 0; });
            requestAnimationFrame(draw);
        }
        draw();
    </script>
</body>
</html>
